









# .github/workflows/ci.yml — Konfigurasi Continuous Integration (CI) untuk Al-Haqq-Protocol
name: Al-Haqq CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Unit Test Suite (Cards & Rules)
      run: python -m unittest test_al_haqq.py
      
    - name: Run Unit Test Suite (Phygital Verifier)
      run: python -m unittest test_phygital.py



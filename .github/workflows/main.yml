name: Al-Haqq Protocol Automated Execution

on:
  schedule:
    - cron: '0 0 * * *' # Eksekusi otomatis setiap hari jam 00:00 UTC
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions di GitHub

jobs:
  run-protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Al-Haqq Protocol Engine
        run: python main.py

      - name: Commit & Push Updated Status Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add al_haqq_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update Al-Haqq status log & ICAM watermark timestamp" && git push)

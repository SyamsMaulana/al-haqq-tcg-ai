<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Al-Haqq TCG AI - Gold MauL</title>
    <style>
        body { background-color: #0b0f19; color: #00ff66; font-family: monospace; padding: 20px; }
        #console { background: #121826; border: 1px solid #00ff66; padding: 15px; height: 300px; overflow-y: scroll; white-space: pre-wrap; }
        input { width: 100%; background: #000; color: #00ff66; border: 1px solid #00ff66; padding: 10px; font-family: monospace; margin-top: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>=== Al-Haqq TCG AI & Gold MauL Console ===</h2>
    <div id="console">[System Initialized] Menunggu perintah protokol...</div>
    <input type="text" id="commandInput" placeholder="Ketik perintah (contoh: status gold maul)..." autofocus>
    <script>
        async function sendCommand() {
            const input = document.getElementById('commandInput');
            const consoleBox = document.getElementById('console');
            const cmd = input.value.trim();
            if (!cmd) return;
            consoleBox.innerText += "\n> " + cmd + "\n[Processing...]";
            input.value = '';
            consoleBox.scrollTop = consoleBox.scrollHeight;
            try {
                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command: cmd})
                });
                const data = await res.json();
                consoleBox.innerText = consoleBox.innerText.replace('[Processing...]', data.reply);
            } catch (e) {
                consoleBox.innerText = consoleBox.innerText.replace('[Processing...]', '[Error] Koneksi gagal.');
            }
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
        document.getElementById('commandInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendCommand(); });
    </script>
</body>
</html>

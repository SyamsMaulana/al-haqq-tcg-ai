<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Al-Haqq TCG AI - Gold MauL</title>
    <style>
        body { background-color: #0b0f19; color: #00ff66; font-family: monospace; padding: 20px; }
        #console { background: #121826; border: 1px solid #00ff66; padding: 15px; height: 300px; overflow-y: scroll; white-space: pre-wrap; }
        input { width: 100%; background: #000; color: #00ff66; border: 1px solid #00ff66; padding: 10px; font-family: monospace; margin-top: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>=== Al-Haqq TCG AI & Gold MauL Console ===</h2>
    <div id="console">[System Initialized] Menunggu perintah protokol...</div>
    <input type="text" id="commandInput" placeholder="Ketik perintah (contoh: status gold maul)..." autofocus>
    <script>
        async function sendCommand() {
            const input = document.getElementById('commandInput');
            const consoleBox = document.getElementById('console');
            const cmd = input.value.trim();
            if (!cmd) return;
            consoleBox.innerText += "\n> " + cmd + "\n[Processing...]";
            input.value = '';
            consoleBox.scrollTop = consoleBox.scrollHeight;
            try {
                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command: cmd})
                });
                const data = await res.json();
                consoleBox.innerText = consoleBox.innerText.replace('[Processing...]', data.reply);
            } catch (e) {
                consoleBox.innerText = consoleBox.innerText.replace('[Processing...]', '[Error] Koneksi gagal.');
            }
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
        document.getElementById('commandInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendCommand(); });
    </script>
</body>
</html>
<div class="mode-toggle-container">
  <button onclick="setGameMode('competitive')">Competitive Mode</button>
  <button onclick="setGameMode('enjoyer')">Enjoyer / Cinematic Mode</button>
</div>
<script>
function setGameMode(mode) {
  fetch('/api/set-mode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: mode })
  })
  .then(response => response.json())
  .then(data => {
    console.log('Mode updated:', data);
    alert('Active Game Mode: ' + mode.toUpperCase());
  })
  .catch(error => console.error('Error:', error));
}
</script>

<div class="bounty-section" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
  <h3>Table Bounties & Cinematic Highlights</h3>
  <div id="bounty-list"></div>
  <div style="margin-top: 10px;">
    <input type="text" id="bountyPlayer" placeholder="Player Name" style="margin-right: 5px; padding: 5px;">
    <input type="text" id="bountyTitle" placeholder="Achievement Title" style="margin-right: 5px; padding: 5px;">
    <button onclick="submitBounty()" style="padding: 5px 10px;">Log Bounty</button>
  </div>
</div>

<script>
function loadBounties() {
  fetch('/api/bounties')
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById('bounty-list');
      list.innerHTML = data.map(b => `<p>🏆 <strong>${b.player}</strong>: ${b.title}</p>`).join('');
    });
}
function submitBounty() {
  fetch('/api/bounties', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      player: document.getElementById('bountyPlayer').value,
      title: document.getElementById('bountyTitle').value,
      description: "Cinematic moment unlocked at the table!"
    })
  }).then(() => {
    document.getElementById('bountyPlayer').value = '';
    document.getElementById('bountyTitle').value = '';
    loadBounties();
  });
}
loadBounties();
</script>

<div class="boss-section" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
  <h3>Archenemy Threat Assessment</h3>
  <button onclick="calculateThreats()" style="padding: 5px 10px;">Calculate Board Threats</button>
  <div id="threat-list" style="margin-top: 10px;"></div>
</div>

<script>
function calculateThreats() {
  const samplePlayers = [
    { name: "GOD•MauL", life: 30, permanents_count: 5, hand_size: 4 },
    { name: "Player 2", life: 25, permanents_count: 8, hand_size: 2 },
    { name: "Player 3", life: 35, permanents_count: 3, hand_size: 6 }
  ];
  fetch('/api/boss-raid', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ players: samplePlayers })
  })
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById('threat-list');
    list.innerHTML = data.map(t => `<p>⚠️ <strong>${t.player}</strong>: Threat Score ${t.threat_score}</p>`).join('');
  });
}
</script>
